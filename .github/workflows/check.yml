name: Verify extension
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run verify
      - run: npm run package
      - run: npm run check:firefox
      - run: npm run package:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-localizer
          path: artifacts/youtube-localizer-*.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results
